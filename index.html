<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blakus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }
    h1 {
      color: #00d9a3;
      font-size: 2rem;
      letter-spacing: 0.4em;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(0, 217, 163, 0.4);
    }
    canvas {
      border: 2px solid #2a2a4a;
      display: block;
    }
    p {
      color: #4a4a6a;
      margin-top: 10px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <h1>BLAKUS</h1>
  <canvas id="game"></canvas>
  <p>1P: WASD to move · SHIFT to jump · Q respawn &nbsp;&nbsp;|&nbsp;&nbsp; 2P: ARROWS to move · SPACE to jump · R respawn &nbsp;&nbsp;|&nbsp;&nbsp; E at door · P pause · M menu</p>

  <script src="src/input.js"></script>
  <script src="src/platform.js"></script>
  <script src="src/spike.js"></script>
  <script src="src/door.js"></script>
  <script src="src/player.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/level.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
